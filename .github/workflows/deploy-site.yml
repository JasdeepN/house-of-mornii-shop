name: Deploy site

# Builds the storefront and deploys it to its Worker:
#   push to dev  -> dev-hom  -> dev.houseofmornii.com  (GitHub environment "dev")
#   push to main -> prod-hom -> houseofmornii.com      (GitHub environment "production")
# Each environment holds its own VITE_SHOPIFY_STORE_DOMAIN and
# VITE_SHOPIFY_STOREFRONT_TOKEN, and only its own branch may use it.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    permissions:
      contents: read
      actions: read
    env:
      SITE_CONFIG: wrangler.site.${{ github.ref_name == 'main' && 'production' || 'dev' }}.jsonc
      EXPECTED_STORE: ${{ github.ref_name == 'main' && '2svzqt-hg.myshopify.com' || 'dev-hom.myshopify.com' }}
      VITE_SHOPIFY_STORE_DOMAIN: ${{ secrets.VITE_SHOPIFY_STORE_DOMAIN }}
      VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_TOKEN }}
      SITE_HOST: ${{ github.ref_name == 'main' && 'houseofmornii.com' || 'dev.houseofmornii.com' }}
      VITE_SITE_URL: ${{ github.ref_name == 'main' && 'https://houseofmornii.com' || 'https://dev.houseofmornii.com' }}
      # Shopify's hosted account pages (email and phone changes), per environment.
      VITE_SHOPIFY_ACCOUNT_URL: ${{ vars.VITE_SHOPIFY_ACCOUNT_URL }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Production only: the code must already have passed the end-to-end suite
      # on dev (a green Deploy site run on a dev commit with the same tree).
      - name: Require a green dev run for this code
        if: github.ref_name == 'main'
        run: .github/scripts/require-dev-green.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # Backstop: if an environment secret is ever missing, GitHub falls back
      # to the repo-wide secret of the same name. Refuse to build then.
      - name: Check the store matches the branch
        run: |
          if [ "$VITE_SHOPIFY_STORE_DOMAIN" != "$EXPECTED_STORE" ]; then
            echo "::error::This branch must build against $EXPECTED_STORE"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy -c ${{ env.SITE_CONFIG }}

      # Dev: prove the deployed build with the full end-to-end suite.
      # Production: confirm it with the read-only tier only.
      - name: Wait for the site to serve this build
        run: |
          entry=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -n 1)
          if [ -z "$entry" ]; then
            echo "::error::Could not find the entry script in dist/index.html"
            exit 1
          fi
          echo "Waiting for $entry"
          for attempt in $(seq 1 40); do
            if curl -fsS "https://${SITE_HOST}/?cb=$attempt" | grep -qF "$entry"; then
              echo "Serving the new build"
              exit 0
            fi
            sleep 6
          done
          echo "::error::${SITE_HOST} did not serve $entry within 4 minutes"
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The enquiry Worker deploys from deploy.yml in parallel; the dev-only enquiry
      # journey needs it live (the Worker answers GET with 405).
      - name: Wait for the enquiry Worker
        if: github.ref_name == 'dev'
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://dev.houseofmornii.com/api/enquiry?cb=$attempt")
            if [ "$status" = "405" ]; then
              echo "Enquiry Worker is live"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The enquiry Worker did not answer within 5 minutes; the enquiry journey may fail"

      - name: Run end-to-end tests
        if: github.ref_name == 'dev'
        run: npm run test:e2e
        env:
          CI: "true"
          E2E_BASE_URL: https://dev.houseofmornii.com
          E2E_SHOPIFY_STORE_DOMAIN: ${{ secrets.VITE_SHOPIFY_STORE_DOMAIN }}
          E2E_STORE_PASSWORD: ${{ secrets.E2E_STORE_PASSWORD }}
          E2E_CUSTOMER_SESSION: ${{ secrets.E2E_CUSTOMER_SESSION }}
          E2E_SHOPIFY_CLIENT_ID: ${{ secrets.E2E_SHOPIFY_CLIENT_ID }}
          E2E_SHOPIFY_CLIENT_SECRET: ${{ secrets.E2E_SHOPIFY_CLIENT_SECRET }}
          E2E_ENQUIRY_DRY_RUN_TOKEN: ${{ secrets.E2E_ENQUIRY_DRY_RUN_TOKEN }}

      # Production: read-only tier only, no secrets. The dev-only tier places
      # real Orders and must never run here.
      - name: Run read-only end-to-end tests (production)
        if: github.ref_name == 'main'
        run: npm run test:e2e:read-only
        env:
          CI: "true"
          E2E_BASE_URL: https://houseofmornii.com

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
